

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: dhis2-postgres
    environment:
      POSTGRES_USER: dhis
      POSTGRES_DB: dhis2
      POSTGRES_PASSWORD: dhis
    command: postgres -c max_locks_per_transaction=100
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhis -d dhis2"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: dhis2/core:2.40.8
    container_name: dhis2-web
    ports:
      - "8080:8080"
    environment:
      - WAIT_FOR_DB_CONTAINER=db:5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dhis.conf:/opt/dhis2/dhis.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
